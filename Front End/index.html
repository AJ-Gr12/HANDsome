<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign Language Trainer</title>
  <link rel="stylesheet" href="index.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
  <div class="column">
    <h1>HANDsome</h1>
    <label for="sign-select">Sign to practice</label>
    <select id="sign-select"></select>

    <img id="video" src="/video" alt="Live camera feed">

    <div id="progress"><div id="progress-fill"></div></div>
    <div id="feedback" class="info">Loading...</div>

    <div>
      <img id="letterImage" src="Images/b_asl.jpg" alt  = "No Image">
    </div>

  </div>


    <div class="column">
      <select id="modeSelect">'
      <option value = "tryonyourown">Try on Your Own</option>
      <option value = "practice">Practice</option>
    </select>

    </div>
  </div>
  
  <section>
    
 
    <section id="left">
      
    

    
    </section>

    <section id="right">
    
  </section>
 
  </section>

  

  <script> 
  
    const select = document.getElementById("sign-select");
const feedback = document.getElementById("feedback");
const letterImage = document.getElementById('letterImage');


function setFeedback(kind, text) {
  feedback.className = kind;   // "info", "correct", or "wrong" (styled in style.css)
  feedback.textContent = text;
  setImage();
}


// Front end -> back end: "this is the sign I'm looking for"
async function setTarget(sign) {
  await fetch("/target", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ sign }),
  });
}

async function loadSigns() {
  const res = await fetch("/signs");
  const data = await res.json();

  select.innerHTML = "";
  for (const sign of data.signs) {
    const option = document.createElement("option");
    option.value = sign;
    option.textContent = sign;
    select.appendChild(option);
  }

  if (data.signs.length > 0) {
    setTarget(data.signs[0]);
  } else {
    setFeedback("info", "No signs saved yet. Record some references first.");
  }
}

// Back end -> front end: "is it correct right now?"
const bar = document.getElementById("progress-fill");
const progress = document.getElementById("progress");

async function pollStatus() {
  try {
    const res = await fetch("/status");
    const s = await res.json();

    //Changes Image
    letterImage.src = `Images/${(s.target).toLowerCase()}_asl.jpg`;
    

    if (!s.target) return;

    const isMotion = s.kind === "motion";

    // The hold bar only makes sense for static letters
    progress.style.display = isMotion ? "none" : "block";
    bar.style.width = s.hold_progress + "%";

    if (isMotion && s.phase === "done") {
      // Check this first, since the hand may have left the frame by now
      if (s.correct) {
        setFeedback("correct", `Correct! That's ${s.target}`);
      } else {
        setFeedback("wrong", "Not quite, try again");
      }
    } else if (!s.hand_visible) {
      setFeedback("info", "Show your hand to the camera");
    } else if (isMotion) {
      if (s.phase === "recording") {
        setFeedback("info", "Keep going...");
      } else {
        setFeedback("info", "Make the starting handshape, then move");
      }
    } else if (s.correct) {
      setFeedback("correct", `Correct! That's ${s.target}`);
    } else if (s.matching) {
      setFeedback("info", `Hold it... ${s.hold_progress}%`);
    } else {
      setFeedback("wrong", `Not quite, keep trying ${s.target}`);
    }
  } catch (err) {
    setFeedback("info", "Can't reach the back end");
  }

  
    
}


select.addEventListener("change", () => setTarget(select.value));

loadSigns();
setInterval(pollStatus, 300);   // ask for status 3 times a second
  </script>
</body>
</html>
